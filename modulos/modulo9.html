<header class="app-header">
    <div class="header-left">
        <h2 class="page-title">Quadro Informativo e Comunicados</h2>
    </div>
    <div class="header-right">
        <span id="user-display" style="color:white;"></span>
    </div>
</header>

<div class="content-area">
    <!-- Bloco de Notas / Quadro Informativo Oficial -->
    <div class="panel p-6" style="background: var(--primary-900); border: 1px solid var(--primary-700); border-radius: 8px; max-width: 900px; margin: 0 auto;">
        
        <!-- Cabeçalho do Bloco -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary-700); padding-bottom: 1rem; margin-bottom: 1.5rem;">
            <div>
                <h3 id="bloco-titulo-display" style="color: var(--accent-500); font-size: 1.25rem; font-weight: bold; margin: 0;">📌 Bloco de Notas da Operação</h3>
                <span id="bloco-data-info" style="font-size: 0.75rem; color: var(--primary-400);">Carregando informações...</span>
            </div>
            <span style="background: var(--primary-800); color: var(--primary-300); padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.75rem;">Canal Oficial</span>
        </div>

        <!-- Visão de Leitura (Para todo o efetivo operacional) -->
        <div id="bloco-view-mode" style="background: var(--primary-950); padding: 1.5rem; border-radius: 6px; border-left: 4px solid var(--accent-500); color: var(--primary-200); font-size: 1rem; line-height: 1.6; white-space: pre-wrap; min-height: 150px;">
            Carregando diretrizes operacionais...
        </div>

        <!-- Visão de Edição em Bloco de Notas (Apenas Master, Gerência e Administradores) -->
        <div id="bloco-edit-mode" style="display: none; margin-top: 1.5rem; border-top: 1px dashed var(--primary-700); padding-top: 1.5rem;">
            <h4 style="color: white; font-size: 0.95rem; margin-bottom: 1rem;">✏️ Painel de Edição da Supervisão</h4>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.8rem; color: var(--primary-400); margin-bottom: 0.25rem;">Título do Comunicado</label>
                <input type="text" id="bloco-input-titulo" class="form-input" style="width: 100%; background: var(--primary-950); border: 1px solid var(--primary-700); color: white; padding: 0.75rem; border-radius: 4px;" placeholder="Ex: Escala de Serviço e Alinhamento Geral">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.8rem; color: var(--primary-400); margin-bottom: 0.25rem;">Conteúdo / Anotações do Bloco</label>
                <textarea id="bloco-input-conteudo" rows="8" class="form-input" style="width: 100%; background: var(--primary-950); border: 1px solid var(--primary-700); color: white; padding: 0.75rem; border-radius: 4px; resize: vertical; font-family: inherit;" placeholder="Escreva aqui as diretrizes, avisos ou recados importantes para o efetivo..."></textarea>
            </div>

            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="bloco-btn-salvar" class="btn btn-primary" style="background: var(--accent-600); color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold;">Salvar e Publicar no Bloco</button>
                <span id="bloco-status-msg" style="font-size: 0.85rem;"></span>
            </div>
        </div>

    </div>
</div>
