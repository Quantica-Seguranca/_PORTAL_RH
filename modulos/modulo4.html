<header class="app-header">
    <div class="header-left">
        <h2 class="page-title">Gestão de Holerites</h2>
    </div>
</header>

<div class="content-area">
    <!-- Zona de Upload (Drag & Drop) -->
    <div class="panel mb-4" style="padding: 2rem; text-align: center; border: 2px dashed var(--primary-600); cursor: pointer; transition: all 0.3s ease; margin-bottom: 1.5rem;" id="drop-zone">
        <h3 style="color: var(--white); margin-bottom: 0.5rem;">
            <span>📥</span> Upload em Lote de Holerites (PDF)
        </h3>
        <p style="color: var(--primary-400); font-size: 0.875rem;">Arraste os arquivos PDF aqui ou clique para selecionar</p>
        <input type="file" id="file-upload" accept=".pdf" multiple style="display: none;">
    </div>

    <!-- Fila de Processamento -->
    <div id="upload-queue" class="panel mb-4" style="display: none; padding: 1.25rem; margin-bottom: 1.5rem;">
        <h4 style="color: var(--accent-500); margin-bottom: 1rem; font-size: 0.875rem; text-transform: uppercase;">Processando Envios</h4>
        <div id="upload-list" style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;"></div>
    </div>

    <!-- Acervo Organizado por Pastas de Competência -->
    <div class="panel">
        <div class="panel__header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="text-white text-md font-bold">Acervo Organizado por Competência (Pastas)</h3>
        </div>
        
        <!-- Contêiner onde as "Pastas" por Mês/Competência serão injetadas -->
        <div id="container-pastas-holerites" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
            <div class="text-center" style="padding: 2rem; color: var(--primary-400); text-align: center;">Carregando acervo de documentos...</div>
        </div>
    </div>
</div>
